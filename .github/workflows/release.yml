name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Grammar Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-aviutl-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-aviutl-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: aviutl-script-vsix
          path: vscode-aviutl-script/*.vsix

  release:
    name: Create GitHub Release
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aviutl-script-vsix
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.vsix'
